[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "simtabi-autotest"
version = "0.1.0"
description = "AI-driven test generation with mutation-testing quality gate. PHP, JS/TS, Vue, Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Simtabi", email = "simtabihq@gmail.com" },
]
keywords = [
    "testing", "test-generation", "mutation-testing", "ai", "llm",
    "pest", "phpunit", "vitest", "jest", "pytest",
    "laravel", "vue", "react", "typescript",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "tree-sitter>=0.22.0",
    "lxml>=5.2.0",
    "gitpython>=3.1.43",
]

[project.optional-dependencies]
# Per-language grammars are opt-in extras so a JS-only consumer doesn't
# pay the PHP grammar's install cost, and vice versa.
php = ["tree-sitter-php>=0.22.0"]
js = ["tree-sitter-javascript>=0.21.0"]
ts = ["tree-sitter-typescript>=0.21.0"]
vue = ["tree-sitter-javascript>=0.21.0", "tree-sitter-html>=0.21.0"]
python = ["tree-sitter-python>=0.21.0"]
all = [
    "tree-sitter-php>=0.22.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-html>=0.21.0",
    "tree-sitter-python>=0.21.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "tree-sitter-php>=0.22.0",
]

[project.scripts]
autotest = "autotest.cli:app"

[project.urls]
Homepage = "https://github.com/simtabi/autotest"
Documentation = "https://github.com/simtabi/autotest#readme"
Repository = "https://github.com/simtabi/autotest"
Issues = "https://github.com/simtabi/autotest/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/autotest"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # pycodestyle, pyflakes
    "I",            # isort
    "UP",           # pyupgrade
    "B",            # bugbear
    "SIM",          # simplify
    "RUF",          # ruff-specific
]
ignore = [
    "E501",   # line length: handled by formatter
    "B008",   # `Depends(...)` / `Argument(...)` in defaults is THE Typer pattern
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/autotest"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
