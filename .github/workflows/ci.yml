name: CI

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests

      - name: Type-check with mypy
        run: mypy src
        continue-on-error: true  # strict mode is aspirational while we're alpha

      - name: Run pytest
        run: pytest --cov --cov-report=term-missing

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with PHP extra (tree-sitter-php is opt-in)
        run: pip install -e '.[php]'

      - name: autotest --help
        run: autotest --help

      - name: autotest version
        run: autotest version

      - name: autotest php inventory on a fixture
        run: autotest php inventory tests/fixtures/php/SampleService.php

      - name: autotest php generate (dry-run with fake generator)
        run: autotest php generate tests/fixtures/php/SampleService.php --generator=fake --dry-run
